version: "3.9"

services:
    # Soketi container
    soketi-mts:
        image: quay.io/soketi/soketi:latest
        container_name: soketi_mts
        ports:
            - "6002:6002"
            - "9602:9602"
        environment:
            DEBUG: "soketi:*"
            SOKETI_HOST: "0.0.0.0"
            SOKETI_PORT: 6002
            SOKETI_DEFAULT_APP_ID: "3001"
            SOKETI_DEFAULT_APP_KEY: "f4a7c2d9e8b1a3c6d5e7f0a9b2c4d6e1"
            SOKETI_DEFAULT_APP_SECRET: "a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0"
            SOKETI_METRICS_SERVER_PORT: 9602
        restart: unless-stopped

    # Laravel scheduler container
    scheduler:
        build: .
        container_name: laravel_scheduler_mts
        working_dir: /var/www
        volumes:
            - .:/var/www
        env_file:
            - .env.docker
        restart: unless-stopped
        depends_on:
            - soketi-mts
        command: php artisan schedule:work